name = "realmwright-care"
main = "src/index.js"
compatibility_date = "2026-07-01"

# ── Static assets: intake wizard, board, owner-desk SHELL are all plain
# files served by Cloudflare's asset layer directly — free & unlimited,
# never touch the Worker request budget (design §2.2, lever #1).
# run_worker_first lists the ONLY paths that must go through the Worker
# first: the JSON API, auth redirects, and /desk (needs a server-side
# owner check before it will even hand out the HTML — "invisible" 404
# for non-owners, not just client-side hidden).
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/auth/*", "/desk", "/desk/*", "/privacy", "/privacy/"]

# ── D1 (SQLite). This is the REAL database id of the live deployment
# (created via `wrangler d1 create realmwright-care`). It is not a secret —
# it only identifies the database and is useless without account credentials.
# `wrangler dev --local` ignores it (local mode keys its sqlite file off the
# binding + database_name).
[[d1_databases]]
binding = "DB"
database_name = "realmwright-care"
database_id = "4d9ddc05-5e6f-4a56-b657-31a52ed99209"
migrations_dir = "migrations"

# ── Workers AI: owner-desk digests + Build Brief + micro-interview phrasing.
# Design's fallback chain (§7.2): Workers AI → OPENROUTER_KEY secret (optional)
# → deterministic (counts + top items). The app must work with this absent.
[ai]
binding = "AI"

# ── Non-secret config. SESSION_SECRET and OWNER_SETUP_TOKEN are secrets
# configured with wrangler secret put; see care/README.md. No Google client,
# OAuth endpoint, or third-party identity setting is needed.
[vars]
ENVIRONMENT = "production"
SITE_NAME = "RealmWright — Community Board"
FEATURE_MICRO_INTERVIEW = "true"
SESSION_COOKIE_NAME = "rw_care_session"
# Public contact address shown on the /privacy page (deletion/questions).
# Not a secret — it's meant to be published — so it lives here, not in the
# secret store. Left EMPTY on purpose: fill in your own address at deploy
# (see care/README.md). While empty, the privacy page shows a plain
# "set at deploy" placeholder instead of a broken mailto link.
CONTACT_EMAIL = ""
