name: RealmWright Recovery CI

on:
  push:
    branches:
      - agent/realmwright-recovery-2026-07-24
  pull_request:
    branches:
      - claude/realmwright-pivot

permissions:
  contents: write

jobs:
  worker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run Worker tests
        working-directory: worker
        run: npm test

      - name: Run Worker typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Upload exact recovery source
        uses: actions/upload-artifact@v4
        with:
          name: realmwright-recovery-source
          if-no-files-found: error
          retention-days: 7
          path: |
            realmwright-v7.html
            RECOVERY-STATE.md
            worker/src
            worker/test
            worker/package.json
            worker/package-lock.json
            worker/tsconfig.json
            worker/wrangler.toml

  apply-audited-license-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@v4
        with:
          ref: agent/realmwright-recovery-2026-07-24
          fetch-depth: 0

      - name: Stop when no staged recovery patch exists
        id: staged
        shell: bash
        run: |
          if test -f recovery/patches/license-gate-provider-setup.patch; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact pre-change HTML
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          actual="$(sha256sum realmwright-v7.html | awk '{print $1}')"
          expected="5362c5c1fe1a48eb8c799b1b9bd27fd01c9b84e193168b116cb01d19c71afcee"
          test "$actual" = "$expected" || {
            echo "Unexpected pre-change HTML checksum: $actual" >&2
            exit 1
          }

      - name: Verify and apply audited patch
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          git apply --check recovery/patches/license-gate-provider-setup.patch
          git apply recovery/patches/license-gate-provider-setup.patch

      - name: Verify exact post-change HTML
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          actual="$(sha256sum realmwright-v7.html | awk '{print $1}')"
          expected="bdddd0b74683e8ca6e2fde4bf2386a953d076b0cac73ab038a9bb9757b969771"
          test "$actual" = "$expected" || {
            echo "Unexpected post-change HTML checksum: $actual" >&2
            exit 1
          }

      - name: Syntax-check every inline script
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('realmwright-v7.html').read_text(encoding='utf-8')
          blocks = []
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', html, flags=re.I | re.S):
              if re.search(r'\bsrc\s*=', attrs, flags=re.I):
                  continue
              blocks.append(body)
          if not blocks:
              raise SystemExit('No inline scripts found')
          out = Path('/tmp/realmwright-inline-scripts')
          out.mkdir(exist_ok=True)
          for index, body in enumerate(blocks, 1):
              (out / f'inline-{index}.js').write_text(body, encoding='utf-8')
          print(f'Extracted {len(blocks)} inline scripts')
          PY
          for script in /tmp/realmwright-inline-scripts/*.js; do
            node --check "$script"
          done

      - name: Use Node.js 22 for guarded validation
        if: steps.staged.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies for guarded validation
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm ci

      - name: Run complete Worker tests for guarded validation
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm test

      - name: Run Worker typecheck for guarded validation
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm run typecheck

      - name: Restore read-only CI and remove transient files
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          git checkout 3940583e580d131a829c84b6120038131f6b0287 -- .github/workflows/realmwright-recovery-ci.yml
          rm recovery/patches/license-gate-provider-setup.patch
          rm .github/workflows/apply-license-gate-recovery.yml
          rmdir recovery/patches 2>/dev/null || true
          rmdir recovery 2>/dev/null || true

      - name: Verify exact final file scope
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/workflows/apply-license-gate-recovery.yml' \
            '.github/workflows/realmwright-recovery-ci.yml' \
            'realmwright-v7.html' \
            'recovery/patches/license-gate-provider-setup.patch' | sort)"
          test "$actual" = "$expected" || {
            echo "Unexpected final file scope:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          }

      - name: Commit verified license gate
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce license gate on Copilot provider setup"
          git push origin HEAD:agent/realmwright-recovery-2026-07-24
