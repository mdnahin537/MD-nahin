name: RealmWright Recovery CI

on:
  push:
    branches:
      - agent/realmwright-recovery-2026-07-24
  pull_request:
    branches:
      - claude/realmwright-pivot

permissions:
  contents: write

jobs:
  worker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run Worker tests
        working-directory: worker
        run: npm test

      - name: Run Worker typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Upload exact recovery source
        uses: actions/upload-artifact@v4
        with:
          name: realmwright-recovery-source
          if-no-files-found: error
          retention-days: 7
          path: |
            realmwright-v7.html
            RECOVERY-STATE.md
            worker/src
            worker/test
            worker/package.json
            worker/package-lock.json
            worker/tsconfig.json
            worker/wrangler.toml

  apply-idb-license-queue:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@v4
        with:
          ref: agent/realmwright-recovery-2026-07-24
          fetch-depth: 0

      - name: Detect staged queue patch
        id: staged
        run: |
          if test -f recovery/patches/license-idb-queue.patch; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact pre-change HTML
        if: steps.staged.outputs.present == 'true'
        run: test "$(sha256sum realmwright-v7.html | awk '{print $1}')" = "efb12c7c3df61abb652d1c5ff9858b5ecfe2c12b467dab677355c1721ee29f0f"

      - name: Verify and apply audited queue patch
        if: steps.staged.outputs.present == 'true'
        run: |
          git apply --check recovery/patches/license-idb-queue.patch
          git apply recovery/patches/license-idb-queue.patch

      - name: Verify exact post-change HTML
        if: steps.staged.outputs.present == 'true'
        run: test "$(sha256sum realmwright-v7.html | awk '{print $1}')" = "6f52063e8dd4ea1db1cbbbd88ec7292751094428f2017f8f2e443359c18110ef"

      - name: Verify queue migration and persistence code
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          grep -F "const LICENSE_QUEUE_KEY='rw_license_queue_v2'" realmwright-v7.html
          grep -F "const LICENSE_QUEUE_LEGACY_KEY='rw_license_queue'" realmwright-v7.html
          grep -F "await IDB.set(LICENSE_QUEUE_KEY,bounded)" realmwright-v7.html
          grep -F "const queued=await LicenseQueue.push" realmwright-v7.html
          ! grep -F "localStorage.setItem(LICENSE_QUEUE_KEY" realmwright-v7.html

      - name: Syntax-check every real inline script
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False); self.ins=False; self.cur=[]; self.blocks=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script': self.ins='src' not in {str(k).lower():v for k,v in a}; self.cur=[]
              def handle_data(self,d):
                  if self.ins:self.cur.append(d)
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.ins:self.blocks.append(''.join(self.cur));self.ins=False;self.cur=[]
          p=P();p.feed(Path('realmwright-v7.html').read_text(encoding='utf-8'))
          if len(p.blocks)!=3:raise SystemExit(f'Expected 3 inline scripts; found {len(p.blocks)}')
          out=Path('/tmp/rw-scripts');out.mkdir(exist_ok=True)
          for i,b in enumerate(p.blocks,1):(out/f'{i}.js').write_text(b,encoding='utf-8')
          PY
          for script in /tmp/rw-scripts/*.js; do node --check "$script"; done

      - name: Use Node.js 22 for guarded validation
        if: steps.staged.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm ci

      - name: Run complete Worker tests
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm test

      - name: Run Worker typecheck
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm run typecheck

      - name: Verify only the audited HTML changed
        if: steps.staged.outputs.present == 'true'
        run: test "$(git diff --name-only)" = "realmwright-v7.html"

      - name: Commit verified IndexedDB license queue
        if: steps.staged.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add realmwright-v7.html
          git commit -m "Move license retry queue to IndexedDB"
          git push origin HEAD:agent/realmwright-recovery-2026-07-24
