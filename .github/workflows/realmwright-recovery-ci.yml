name: RealmWright Recovery CI

on:
  push:
    branches:
      - agent/realmwright-recovery-2026-07-24
  pull_request:
    branches:
      - claude/realmwright-pivot

permissions:
  contents: write

jobs:
  worker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run Worker tests
        working-directory: worker
        run: npm test

      - name: Run Worker typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Upload exact recovery source
        uses: actions/upload-artifact@v4
        with:
          name: realmwright-recovery-source
          if-no-files-found: error
          retention-days: 7
          path: |
            realmwright-v7.html
            RECOVERY-STATE.md
            worker/src
            worker/test
            worker/package.json
            worker/package-lock.json
            worker/tsconfig.json
            worker/wrangler.toml

  apply-audited-license-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@v4
        with:
          ref: agent/realmwright-recovery-2026-07-24
          fetch-depth: 0

      - name: Stop when no staged recovery patch exists
        id: staged
        shell: bash
        run: |
          if test -f recovery/patches/license-gate-provider-setup.patch; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact pre-change HTML
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          actual="$(sha256sum realmwright-v7.html | awk '{print $1}')"
          expected="5362c5c1fe1a48eb8c799b1b9bd27fd01c9b84e193168b116cb01d19c71afcee"
          test "$actual" = "$expected" || {
            echo "Unexpected pre-change HTML checksum: $actual" >&2
            exit 1
          }

      - name: Verify and apply audited patch
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          git apply --check recovery/patches/license-gate-provider-setup.patch
          git apply recovery/patches/license-gate-provider-setup.patch

      - name: Verify exact post-change HTML
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          actual="$(sha256sum realmwright-v7.html | awk '{print $1}')"
          expected="bdddd0b74683e8ca6e2fde4bf2386a953d076b0cac73ab038a9bb9757b969771"
          test "$actual" = "$expected" || {
            echo "Unexpected post-change HTML checksum: $actual" >&2
            exit 1
          }

      - name: Syntax-check every real inline script
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.in_script = False
                  self.current = []
                  self.blocks = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'script':
                      return
                  attr_map = {str(k).lower(): v for k, v in attrs}
                  self.in_script = 'src' not in attr_map
                  self.current = []

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      self.blocks.append(''.join(self.current))
                      self.in_script = False
                      self.current = []

          parser = ScriptParser()
          parser.feed(Path('realmwright-v7.html').read_text(encoding='utf-8'))
          if len(parser.blocks) != 3:
              raise SystemExit(f'Expected 3 inline scripts; found {len(parser.blocks)}')
          out = Path('/tmp/realmwright-inline-scripts')
          out.mkdir(exist_ok=True)
          for index, body in enumerate(parser.blocks, 1):
              (out / f'inline-{index}.js').write_text(body, encoding='utf-8')
          print('Extracted exactly 3 real inline scripts')
          PY
          for script in /tmp/realmwright-inline-scripts/*.js; do
            node --check "$script"
          done

      - name: Use Node.js 22 for guarded validation
        if: steps.staged.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies for guarded validation
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm ci

      - name: Run complete Worker tests for guarded validation
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm test

      - name: Run Worker typecheck for guarded validation
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm run typecheck

      - name: Restore read-only CI and remove transient files
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          git checkout 3940583e580d131a829c84b6120038131f6b0287 -- .github/workflows/realmwright-recovery-ci.yml
          rm recovery/patches/license-gate-provider-setup.patch
          rm .github/workflows/apply-license-gate-recovery.yml
          rmdir recovery/patches 2>/dev/null || true
          rmdir recovery 2>/dev/null || true

      - name: Verify final scope allowlist
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          test ! -e recovery/patches/license-gate-provider-setup.patch
          test ! -e .github/workflows/apply-license-gate-recovery.yml
          git diff --quiet -- realmwright-v7.html && {
            echo "Expected realmwright-v7.html to be changed" >&2
            exit 1
          }
          unexpected="$(git diff --name-only | grep -Ev '^(realmwright-v7\.html|\.github/workflows/realmwright-recovery-ci\.yml|\.github/workflows/apply-license-gate-recovery\.yml|recovery/patches/license-gate-provider-setup\.patch)$' || true)"
          test -z "$unexpected" || {
            echo "Unexpected changed paths:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }
          printf 'Approved changed paths:\n'
          git diff --name-only

      - name: Commit verified license gate
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce license gate on Copilot provider setup"
          git push origin HEAD:agent/realmwright-recovery-2026-07-24
