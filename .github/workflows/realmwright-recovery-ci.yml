name: RealmWright Recovery CI

on:
  push:
    branches:
      - agent/realmwright-recovery-2026-07-24
  pull_request:
    branches:
      - claude/realmwright-pivot

permissions:
  contents: write

jobs:
  worker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run Worker tests
        working-directory: worker
        run: npm test

      - name: Run Worker typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Upload exact recovery source
        uses: actions/upload-artifact@v4
        with:
          name: realmwright-recovery-source
          if-no-files-found: error
          retention-days: 7
          path: |
            realmwright-v7.html
            RECOVERY-STATE.md
            worker/src
            worker/test
            worker/package.json
            worker/package-lock.json
            worker/tsconfig.json
            worker/wrangler.toml

  apply-device-token-continuity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@v4
        with:
          ref: agent/realmwright-recovery-2026-07-24
          fetch-depth: 0

      - name: Detect staged token-continuity patch
        id: staged
        run: |
          if test -f recovery/patches/license-device-token-continuity.patch; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact pre-change HTML
        if: steps.staged.outputs.present == 'true'
        run: test "$(sha256sum realmwright-v7.html | awk '{print $1}')" = "28484edee17bcb820296d0bb3f436936ec3f716365e2a3357fe28cb50d739ee5"

      - name: Verify and apply audited token patch
        if: steps.staged.outputs.present == 'true'
        run: |
          git apply --check recovery/patches/license-device-token-continuity.patch
          git apply recovery/patches/license-device-token-continuity.patch

      - name: Verify exact post-change HTML
        if: steps.staged.outputs.present == 'true'
        run: test "$(sha256sum realmwright-v7.html | awk '{print $1}')" = "b33a7f2f977a98de041dd233f29d5ec0d5087f22917a80f8cba99dae48cb6138"

      - name: Verify token lifecycle code
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          grep -F "const clears=ls?[[IDB_KEY_LICENSE,null]]:[[IDB_KEY_LICENSE,null],[IDB_KEY_DEVICE_TOKEN,null]]" realmwright-v7.html
          grep -F "if(survivors.length===0)" realmwright-v7.html
          grep -F "await IDB.set(IDB_KEY_DEVICE_TOKEN,null)" realmwright-v7.html

      - name: Syntax-check every real inline script
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(convert_charrefs=False);self.ins=False;self.cur=[];self.blocks=[]
              def handle_starttag(self,t,a):
                  if t.lower()=='script':self.ins='src' not in {str(k).lower():v for k,v in a};self.cur=[]
              def handle_data(self,d):
                  if self.ins:self.cur.append(d)
              def handle_endtag(self,t):
                  if t.lower()=='script' and self.ins:self.blocks.append(''.join(self.cur));self.ins=False;self.cur=[]
          p=P();p.feed(Path('realmwright-v7.html').read_text(encoding='utf-8'))
          if len(p.blocks)!=3:raise SystemExit(f'Expected 3 inline scripts; found {len(p.blocks)}')
          out=Path('/tmp/rw-scripts');out.mkdir(exist_ok=True)
          for i,b in enumerate(p.blocks,1):(out/f'{i}.js').write_text(b,encoding='utf-8')
          PY
          for script in /tmp/rw-scripts/*.js; do node --check "$script"; done

      - name: Use Node.js 22 for guarded validation
        if: steps.staged.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm ci

      - name: Run complete Worker tests
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm test

      - name: Run Worker typecheck
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm run typecheck

      - name: Verify only the audited HTML changed
        if: steps.staged.outputs.present == 'true'
        run: test "$(git diff --name-only)" = "realmwright-v7.html"

      - name: Commit verified device-token continuity fix
        if: steps.staged.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add realmwright-v7.html
          git commit -m "Preserve device token until deactivation completes"
          git push origin HEAD:agent/realmwright-recovery-2026-07-24
