name: RealmWright Recovery CI

on:
  push:
    branches:
      - agent/realmwright-recovery-2026-07-24
  pull_request:
    branches:
      - claude/realmwright-pivot

permissions:
  contents: write

jobs:
  worker-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run Worker tests
        working-directory: worker
        run: npm test

      - name: Run Worker typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Upload exact recovery source
        uses: actions/upload-artifact@v4
        with:
          name: realmwright-recovery-source
          if-no-files-found: error
          retention-days: 7
          path: |
            realmwright-v7.html
            RECOVERY-STATE.md
            worker/src
            worker/test
            worker/package.json
            worker/package-lock.json
            worker/tsconfig.json
            worker/wrangler.toml

  apply-numeric-config-hardening:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@v4
        with:
          ref: agent/realmwright-recovery-2026-07-24
          fetch-depth: 0

      - name: Detect staged numeric patches
        id: staged
        shell: bash
        run: |
          if test -f recovery/patches/worker-numeric-config-core.patch && test -f recovery/patches/worker-numeric-config-tests.patch; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify exact pre-change Worker files
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          test ! -e worker/src/config.ts
          test ! -e worker/test/config-hardening.test.mjs
          test "$(sha256sum worker/src/demo.ts | awk '{print $1}')" = "21bf20e5a99bf9f576d60588ee1b1475e2dc437126d79d0b9bab9610fc940549"
          test "$(sha256sum worker/src/fingerprint.ts | awk '{print $1}')" = "f367ae66c5834e34d6b484094168417810e21e046508a914b56bf49bfd64fa72"
          test "$(sha256sum worker/src/license.ts | awk '{print $1}')" = "e647289a28cdd8827e715fd2aa3bedc478f5476feca2e152b557df6852f42bd3"
          test "$(sha256sum worker/src/ratelimit.ts | awk '{print $1}')" = "607f742e1c27fd3c1d6ab6c153d13ba000974d3226b192264dfb7a95d11b8e93"

      - name: Decode and verify exact audited patches
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('recovery/patches/worker-numeric-config-core.patch').read_text(encoding='utf-8').splitlines(keepends=True)
          output = []
          decoding = False
          marker = '+diff --git a/worker/src/demo.ts b/worker/src/demo.ts'
          for line in source:
              if line.startswith(marker):
                  decoding = True
              if decoding:
                  if not line.startswith('+'):
                      raise SystemExit('Malformed encoded core patch')
                  line = line[1:]
              output.append(line)
          Path('/tmp/worker-numeric-core.patch').write_text(''.join(output), encoding='utf-8')
          PY
          test "$(sha256sum /tmp/worker-numeric-core.patch | awk '{print $1}')" = "bce189957a74a9926d9076f9860871f9e8062fa074d7446be7981049b23b2f28"
          test "$(sha256sum recovery/patches/worker-numeric-config-tests.patch | awk '{print $1}')" = "5cd1757cb08d8cb41320c205f5c6cc2b2a67f02c27617149efcde850ea071998"

      - name: Verify and apply audited numeric patches
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          git apply --check /tmp/worker-numeric-core.patch
          git apply --check recovery/patches/worker-numeric-config-tests.patch
          git apply /tmp/worker-numeric-core.patch
          git apply recovery/patches/worker-numeric-config-tests.patch

      - name: Verify exact post-change Worker files
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          test "$(sha256sum worker/src/config.ts | awk '{print $1}')" = "aada555a457c162af2c6e1039a409a2d9751d562c27c13cd1d079b02666e0a4a"
          test "$(sha256sum worker/src/demo.ts | awk '{print $1}')" = "b14666cff8df099ef456e07fd16217c27931f3075b2722618a735b57c7c156ee"
          test "$(sha256sum worker/src/fingerprint.ts | awk '{print $1}')" = "2a3e361518d936d3442cedd832b6b04e382fd3e0eff7ba8ecafb2f194c473740"
          test "$(sha256sum worker/src/license.ts | awk '{print $1}')" = "8308a258e469e5a6a1cdda55b06b61b54b6518ffab8c2b2e2ce682c5d67118c2"
          test "$(sha256sum worker/src/ratelimit.ts | awk '{print $1}')" = "738b14cdd5b18485dbd907487d6c7cb064b8d28b60373455a3a98e0aec6cb095"
          test "$(sha256sum worker/test/config-hardening.test.mjs | awk '{print $1}')" = "e22495d0874a03387695ddfaa120bf4c006754acc1908393fa533ed2241ceb48"

      - name: Use Node.js 22 for guarded validation
        if: steps.staged.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm ci

      - name: Run complete 37-test Worker suite
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm test

      - name: Run Worker typecheck
        if: steps.staged.outputs.present == 'true'
        working-directory: worker
        run: npm run typecheck

      - name: Verify only audited Worker files changed
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          expected=$'worker/src/config.ts\nworker/src/demo.ts\nworker/src/fingerprint.ts\nworker/src/license.ts\nworker/src/ratelimit.ts\nworker/test/config-hardening.test.mjs'
          actual="$(git status --short | cut -c4- | sort)"
          test "$actual" = "$expected" || { printf 'Unexpected files:\n%s\n' "$actual" >&2; exit 1; }

      - name: Commit verified numeric configuration hardening
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/config.ts worker/src/demo.ts worker/src/fingerprint.ts worker/src/license.ts worker/src/ratelimit.ts worker/test/config-hardening.test.mjs
          git commit -m "Harden numeric Worker configuration"
          git push origin HEAD:agent/realmwright-recovery-2026-07-24
