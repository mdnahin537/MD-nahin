name: Apply Worker Refund Recovery Patch

on:
  push:
    branches:
      - agent/realmwright-recovery-2026-07-24
    paths:
      - recovery/patches/worker-incomplete-response-refund.patch
      - .github/workflows/apply-worker-refund-recovery.yml

permissions:
  contents: write

jobs:
  apply-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact recovery head
        uses: actions/checkout@v4
        with:
          ref: agent/realmwright-recovery-2026-07-24
          fetch-depth: 0

      - name: Verify patch applies cleanly
        run: git apply --check recovery/patches/worker-incomplete-response-refund.patch

      - name: Apply patch
        run: git apply recovery/patches/worker-incomplete-response-refund.patch

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run all Worker tests
        working-directory: worker
        run: npm test

      - name: Run Worker typecheck
        working-directory: worker
        run: npm run typecheck

      - name: Remove transient patch machinery
        run: |
          rm recovery/patches/worker-incomplete-response-refund.patch
          rm .github/workflows/apply-worker-refund-recovery.yml
          rmdir recovery/patches 2>/dev/null || true
          rmdir recovery 2>/dev/null || true

      - name: Commit verified target changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refund unusable demo AI responses"
          git push origin HEAD:agent/realmwright-recovery-2026-07-24
