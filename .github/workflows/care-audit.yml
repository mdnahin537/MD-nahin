name: Customer Care audit
on:
  push:
    branches: [codex/care-audit-recovery]
    paths: ['care/**', '.github/workflows/care-audit.yml']
  pull_request:
    branches: [codex/care-local-identity-auth]
    paths: ['care/**', '.github/workflows/care-audit.yml']
permissions:
  contents: read
concurrency:
  group: care-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare recovery source with repository and live public endpoints
        run: python3 care/tests/preflight.py
      - name: Build the Worker without deploying
        working-directory: care
        run: |
          npm ci
          npx wrangler deploy --dry-run --outdir=test-results/bundle
      - name: Check confirmed workflow regressions
        run: |
          set -o pipefail
          node --test care/tests/*.test.mjs | tee care/test-results/workflow-tests.tap
          python3 -m unittest discover -s care/tests -p 'test_*.py' -v
      - name: Inspect dependency advisories
        working-directory: care
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          const result = spawnSync('npm', ['audit', '--json'], {encoding: 'utf8'});
          if (!result.stdout) throw new Error('Dependency audit did not return a report');
          const report = JSON.parse(result.stdout);
          writeFileSync('test-results/dependencies.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify({counts: report.metadata?.vulnerabilities,
            packages: Object.values(report.vulnerabilities || {}).map(v => ({name:v.name,
              severity:v.severity, range:v.range, fixAvailable:v.fixAvailable,
              advisories:v.via.filter(x=>typeof x==='object').map(x=>({title:x.title,url:x.url,range:x.range}))}))}, null, 2));
          JS
      - name: Prepare a compatible dependency lock update for review
        working-directory: care
        run: |
          npm update wrangler --package-lock-only --ignore-scripts
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const lock = readFileSync('package-lock.json');
          const parsed = JSON.parse(lock);
          console.log(JSON.stringify({proposedWrangler:parsed.packages['node_modules/wrangler'].version}));
          const encoded = lock.toString('base64');
          for (let at=0;at<encoded.length;at+=6000) console.log('CARE_LOCK_PART ' + encoded.slice(at,at+6000));
          JS
      - name: Save public check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-audit-results
          path: care/test-results/
          if-no-files-found: warn
