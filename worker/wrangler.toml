name = "rw-license"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]

# KV namespaces:
#   DEVICES  — { license_key -> JSON{ tokens:[{token, created_at, last_seen_at, instance_id}] } }, TTL 90d
#   RATELIMIT — per-IP request counters for license endpoints
#
# Create them with:
#   wrangler kv:namespace create DEVICES
#   wrangler kv:namespace create RATELIMIT
# then paste the IDs below.
[[kv_namespaces]]
binding = "DEVICES"
id = "REPLACE_WITH_DEVICES_KV_ID"

[[kv_namespaces]]
binding = "RATELIMIT"
id = "REPLACE_WITH_RATELIMIT_KV_ID"

# Cron — fortnightly orphan reaper (every 14 days at 03:00 UTC).
# Cloudflare cron uses 5-field syntax. "0 3 */14 * *" fires roughly fortnightly.
[triggers]
crons = ["0 3 1,15 * *"]

[vars]
# Comma-separated production origin allowlist. file:// loads (itch.io desktop
# bundles, local opens) send Origin: null, which the Worker also allows.
# Hunter: tighten this before public ship.
ALLOWED_ORIGINS = "https://realmwright.app,https://www.realmwright.app,https://html-classic.itch.zone,https://v6p9d9t4.ssl.hwcdn.net"
DEVICE_CAP = "3"
DEVICE_TTL_SECONDS = "7776000"
RATE_LIMIT_PER_MIN = "30"
